name: CI

on:
  push:
    # Tags are checked by the publish workflow.
    branches: ["**"]
  pull_request:
  # Run before publishing a release.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install project and development tools
        run: uv sync --locked
      - name: Lint with Ruff
        run: uv run --locked ruff check .
      - name: Check types with mypy
        run: uv run --locked mypy
      - name: Check recipe content
        run: uv run --locked recettes lint examples/
      - name: Check JavaScript and CSS formatting
        run: npx --yes prettier@3.6.2 --check "src/recettes/static/**/*.{js,css}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install project and development tools
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
