name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install project and development tools
        run: uv sync --locked --extra dev
      - name: Lint with Ruff
        run: uv run --locked ruff check .
      - name: Check recipe content
        run: uv run --locked recettes lint recipes/
      - name: Run tests
        run: uv run --locked pytest
      - name: Check JavaScript and CSS formatting
        run: npx --yes prettier@3.6.2 --check "src/recettes/static/**/*.{js,css}"
