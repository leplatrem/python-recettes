name: CI

on:
  push:
    # Tags are checked by the publish workflow.
    branches: ["**"]
  pull_request:
  # Run before publishing a release.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: uv sync --locked
      - name: Lint Python, JavaScript and CSS
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - name: Check recipe content
        run: uv run --locked recettes lint examples/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
