[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "recettes"
dynamic = ["version"]
description = "Build a static recipe website from Markdown files."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Mathieu Leplatre"}]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
]
keywords = ["recipes", "markdown", "static site"]
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "markdown-it-py>=3",
    "pillow>=10",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/leplatrem/python-recettes"

[project.scripts]
recettes = "recettes.cli:app"

[tool.setuptools.package-data]
recettes = ["densities.json", "static/*", "static/fonts/*", "templates/*"]

[tool.setuptools_scm]
# can be empty if no extra settings are needed, presence enables setuptools_scm

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
