[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "recettes"
dynamic = ["version"]
description = "Build a static recipe website from Markdown files."
readme = "README.md"
# The bundled fonts are under the SIL Open Font License.
license = "CC0-1.0 AND OFL-1.1"
license-files = ["LICENSE", "src/recettes/static/fonts/OFL.txt"]
requires-python = ">=3.11"
authors = [{name = "Mathieu Leplatre"}]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["recipes", "markdown", "static site"]
dependencies = [
    "click>=8",
    "jinja2>=3.1",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "markdown-it-py>=3",
    "pillow>=10",
    "pillow-heif>=0.18",
]

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.6", "ty>=0.0.109"]

[project.urls]
Repository = "https://github.com/leplatrem/python-recettes"

[project.scripts]
recettes = "recettes.cli:app"

[tool.setuptools.package-data]
recettes = ["densities.json", "translations.json", "static/*", "static/fonts/*", "templates/*"]

[tool.setuptools_scm]
# can be empty if no extra settings are needed, presence enables setuptools_scm

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]
# Typographic characters in user facing texts.
allowed-confusables = ["–", "’"]
