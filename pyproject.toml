[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "recettes"
dynamic = ["version"]
description = "Build a static recipe website from Markdown files."
readme = "README.md"
# The bundled fonts are under the SIL Open Font License.
license = "CC0-1.0 AND OFL-1.1"
license-files = ["LICENSE", "src/recettes/static/fonts/OFL.txt"]
requires-python = ">=3.10"
authors = [{name = "Mathieu Leplatre"}]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["recipes", "markdown", "static site"]
dependencies = [
    "click>=8",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "markdown-it-py>=3",
    "pillow>=10",
    "pillow-heif>=0.18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/leplatrem/python-recettes"

[project.scripts]
recettes = "recettes.cli:app"

[tool.setuptools.package-data]
recettes = ["densities.json", "static/*", "static/fonts/*", "templates/*", "templates/partials/*"]

[tool.setuptools_scm]
# can be empty if no extra settings are needed, presence enables setuptools_scm

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]
# Typographic characters in user facing texts.
allowed-confusables = ["–", "’"]
