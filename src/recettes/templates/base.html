<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181a16" media="(prefers-color-scheme: dark)">
    <title>{{ title }}</title>
{% include "meta.html" %}
    <link rel="icon" href="{{ root }}assets/favicon.svg?v={{ versions["favicon.svg"] }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ root }}assets/style.css?v={{ versions["style.css"] }}">
{% block head %}{% endblock %}
  </head>
  <body>
{% block body %}{% endblock %}
    <footer class="site-footer">
{% set recettes_link %}<a href="{{ project_url }}">Recettes v{{ version }}</a>{% endset %}
      {{ license }} {{ t.built_with|replace("{recettes}", recettes_link) }}
    </footer>
  </body>
</html>
