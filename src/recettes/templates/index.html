<!doctype html>
<html lang="{{ lang }}">
  <head>
{{> head.html }}
    <!-- Load recipe pages on hover or touch, where supported (Speculation Rules API). -->
    <script type="speculationrules">
      {"prefetch": [{"where": {"href_matches": "recipes/*"}, "eagerness": "moderate"}]}
    </script>
    <script type="module" src="assets/app.js?v={{ app_js_version }}"></script>
  </head>
  <body>
    <main class="recipe-index">
      <h1>{{ title }}</h1>
      <!-- Search and tags need JavaScript: app.js shows them. -->
      <label class="search-box" data-requires-js hidden>
        <span aria-hidden="true">⌕</span>
        <input id="recipe-search" type="search" aria-label="Search recipes" placeholder="{{ search_placeholder }}" autocomplete="off">
      </label>
      <div class="tag-cloud" id="tag-cloud" data-requires-js hidden>{{ tag_cloud }}</div>
      <div class="recipe-grid" id="recipe-grid">{{ recipe_cards }}</div>
    </main>
{{> footer.html }}
  </body>
</html>
