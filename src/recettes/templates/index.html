{% extends "base.html" %}
{% block head %}
    <!-- Load recipe pages on hover or touch, where supported (Speculation Rules API). -->
    <script type="speculationrules">
      {"prefetch": [{"where": {"href_matches": "recipes/*"}, "eagerness": "moderate"}]}
    </script>
    <script type="module" src="assets/app.js?v={{ app_js_version }}"></script>
{% endblock %}
{% block body %}
    <main class="recipe-index">
      <h1>{{ title }}</h1>
      <!-- Search and tags need JavaScript: app.js shows them. -->
      <label class="search-box" data-requires-js hidden>
        <span class="visually-hidden">{{ t_search_label }}</span>
        <span aria-hidden="true">⌕</span>
        <input id="recipe-search" type="search" placeholder="{{ search_placeholder }}" autocomplete="off">
      </label>
      <div class="tag-cloud" id="tag-cloud" role="group" aria-label="{{ t_tags_label }}" data-requires-js hidden>{{ tag_cloud }}</div>
      <p class="search-status" id="search-status" role="status" data-none="{{ t_results_none }}" data-one="{{ t_results_one }}" data-other="{{ t_results_other }}"></p>
      <div class="recipe-grid" id="recipe-grid">{{ recipe_cards }}</div>
    </main>
{% endblock %}
