<!doctype html>
<html lang="{{ lang }}">
  <head>
{{> head.html }}
    <script type="module" src="../assets/recipe.js?v={{ recipe_js_version }}"></script>
  </head>
  <body>
    <nav class="detail-nav">
      <a href="../index.html" aria-label="{{ t_back }}">←</a>
      {{ edit_link }}
    </nav>
    <main class="recipe-page">
      <article class="recipe">
        <header class="recipe-heading">
          <h1 id="recipe-title">{{ title }}</h1>
          <div class="recipe-meta-row">
            <dl class="recipe-properties" id="recipe-properties"{{ properties_hidden }}>{{ properties }}</dl>
            <div class="recipe-tags" id="recipe-tags">{{ tags }}</div>
          </div>
        </header>
        <section class="ingredients">
          <div class="ingredients-heading">
            <h2 class="ingredients-title">{{ t_ingredients }}</h2>
            <label class="simple-toggle" title="🥛 = 200 ml, 🥄 = 15 ml"{{ simple_hidden }}>
              <input type="checkbox" id="simple-toggle" role="switch">
              <span>{{ t_simple }}</span>
            </label>
            <div class="servings" id="servings-control"{{ servings_attrs }}>
              <button type="button" data-servings-step="-1" aria-label="{{ t_decrease_servings }}">−</button>
              <span><strong id="servings-count">{{ portions }}</strong>×</span>
              <button type="button" data-servings-step="1" aria-label="{{ t_increase_servings }}">+</button>
            </div>
          </div>
          <ul id="ingredient-list">{{ ingredient_list }}</ul>
        </section>
        {{ main_image }}
        <div class="recipe-content" id="recipe-content">{{ content }}</div>
        <div class="recipe-gallery" id="recipe-gallery">{{ gallery }}</div>
      </article>
    </main>
{{> footer.html }}
  </body>
</html>
