<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181a16" media="(prefers-color-scheme: dark)">
    <title>{{ title }}</title>
    {{ meta_tags }}
    <link rel="stylesheet" href="../assets/style.css?v={{ style_css_version }}">
    <script type="module" src="../assets/recipe.js?v={{ recipe_js_version }}"></script>
  </head>
  <body>
    <nav class="detail-nav">
      <a href="../index.html" aria-label="Back">←</a>
      {{ edit_link }}
    </nav>
    <main class="recipe-page">
      <article class="recipe">
        <header class="recipe-heading">
          <h1 id="recipe-title">{{ title }}</h1>
          <div class="recipe-meta-row">
            <dl class="recipe-properties" id="recipe-properties"{{ properties_hidden }}>{{ properties }}</dl>
            <div class="recipe-tags" id="recipe-tags">{{ tags }}</div>
          </div>
        </header>
        <section class="ingredients">
          <div class="ingredients-heading">
            <h2 class="ingredients-title">Ingredients</h2>
            <label class="simple-toggle" title="🥛 = 200 ml, 🥄 = 15 ml"{{ simple_hidden }}>
              <input type="checkbox" id="simple-toggle" role="switch">
              <span>Simple</span>
            </label>
            <div class="servings" id="servings-control"{{ servings_attrs }}>
              <button type="button" data-servings-step="-1" aria-label="Decrease servings">−</button>
              <span><strong id="servings-count">{{ portions }}</strong>×</span>
              <button type="button" data-servings-step="1" aria-label="Increase servings">+</button>
            </div>
          </div>
          <ul id="ingredient-list">{{ ingredient_list }}</ul>
        </section>
        {{ main_image }}
        <div class="recipe-content" id="recipe-content">{{ content }}</div>
        <div class="recipe-gallery" id="recipe-gallery">{{ gallery }}</div>
      </article>
    </main>
    <footer class="site-footer">
      {{ license }} Built with
      <a href="https://github.com/leplatrem/python-recettes">Recettes</a>, the free software
      that turns Markdown files into a recipes website.
    </footer>
  </body>
</html>
